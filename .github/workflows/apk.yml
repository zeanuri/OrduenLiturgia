name: Construir la app (APK de pruebas)

on:
  push:
    branches: [main]
    paths: ['app/**', 'generador/**', 'textos/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generar los días que la app lleva dentro
        run: python generador/generar.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle -p app/android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OrduenLiturgia-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
