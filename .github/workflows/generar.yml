name: Generar los días y publicar

on:
  # GitHub dispara los horarios con horas de retraso: por eso van varias
  # ventanas tras la medianoche de Madrid. Con 365 días por delante, el día de
  # hoy lleva generado desde hace un año; el retraso solo afecta a lo corregido.
  schedule:
    - cron: '11 23 * * *'
    - cron: '37 1 * * *'
    - cron: '21 3 * * *'
  push:
    branches: [main]
    paths: ['generador/**', 'textos/**', 'app/web/**', '.github/workflows/generar.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - name: Pruebas
        run: python -m pytest generador -q
      - name: Generar la ventana de días
        run: python generador/generar.py --inventario
      - name: "Puerta: ningún texto de prueba en lo que se publica"
        run: |
          if grep -rl '"prueba":true' salida/dias; then echo "Hay partes con texto de prueba"; exit 1; fi
      - name: Montar el sitio (datos en la raíz, la web de la app en /app/)
        run: |
          mkdir -p _site/app
          cp -r salida/. _site/
          cp -r app/web/. _site/app/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    # GitHub Pages gratuito exige repositorio público: en privado se genera y no se publica.
    if: ${{ !github.event.repository.private }}
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
