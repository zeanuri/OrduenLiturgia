plugins { id 'com.android.application' }

// Clave de firma fija (secretos del repositorio). Sin ella, el APK sale sin firmar de release.
def almacen = System.getenv('FIRMA_ALMACEN')
def numero = (System.getenv('NUMERO_VERSION') ?: '1') as Integer

android {
    namespace 'io.github.zeanuri.orduenliturgia'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.zeanuri.orduenliturgia'
        minSdk 24
        targetSdk 34
        versionCode numero
        versionName "0.1.${numero}"
    }
    signingConfigs {
        if (almacen) {
            fija {
                storeFile file(almacen)
                storePassword System.getenv('FIRMA_CONTRASENA')
                keyAlias System.getenv('FIRMA_ALIAS')
                keyPassword System.getenv('FIRMA_CONTRASENA')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (almacen) {
                signingConfig signingConfigs.fija
            }
        }
    }
    lint { checkReleaseBuilds false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Copia de la web y de los dias generados (salida/): solo se usa si la app
    // arranca sin conexion antes de haber guardado nada.
    sourceSets { main { assets.srcDirs = ["${buildDir}/web-assets"] } }
}

def webAssets = tasks.register('webAssets', Copy) {
    from('../../web')
    from('../../../salida') {
        into 'datos'
        exclude 'faltan.txt'
    }
    into("${buildDir}/web-assets")
}
preBuild.dependsOn webAssets

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
